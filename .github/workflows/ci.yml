name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pip-audit bandit
      - run: pytest -q
      - run: bandit -q -r auth.py server.py        # analyse statique sécurité
      - run: pip-audit -r requirements.txt          # vulnérabilités des dépendances
      - run: docker build -t mcp-secure-gateway .
